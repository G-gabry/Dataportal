name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - deployment
      - dynamic-vm-ip-auto-deploy

env:
  PROJECT_ID: uniapply-486919
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: uniapply-repo

jobs:
  # ─── Detect which parts of the repo changed ───────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─── Deploy Backend ────────────────────────────────────────────────────────
  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.ref == 'refs/heads/dynamic-vm-ip-auto-deploy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: data-portal-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/backend:${{ github.sha }}
          flags: --allow-unauthenticated --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3 --add-cloudsql-instances=uniapply-486919:me-central1:data-portal-db
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DEFAULT_AI_PROVIDER=gemini
            DEFAULT_AI_MODEL=gemini-2.0-flash
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_ZONE=me-central1-b
            FIRECRAWL_VM_NAME=firecrawl

  # ─── Deploy Frontend ───────────────────────────────────────────────────────
  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.ref == 'refs/heads/dynamic-vm-ip-auto-deploy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/frontend
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_URL }} \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            ./frontend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: data-portal-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/frontend:${{ github.sha }}
          flags: --allow-unauthenticated --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3
