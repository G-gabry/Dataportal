name: Deploy to Cloud Run

on:
  push:
    branches:
      - deploy/cloud-run-updates
      - main
  workflow_dispatch:

env:
  PROJECT_ID: uniapply-486919
  REGION: me-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Fetch Secrets from GCP Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            DATABASE_URL:uniapply-486919/DATABASE_URL
            SECRET_KEY:uniapply-486919/SECRET_KEY
            GEMINI_API_KEY:uniapply-486919/GEMINI_API_KEY
            ALLOWED_ORIGINS:uniapply-486919/ALLOWED_ORIGINS
            NEXT_PUBLIC_API_URL:uniapply-486919/NEXT_PUBLIC_API_URL

      # ─── BACKEND ───────────────────────────────────────────────
      - name: Build Backend Image
        run: |
          docker build \
            -t gcr.io/$PROJECT_ID/data-portal-backend:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/data-portal-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push gcr.io/$PROJECT_ID/data-portal-backend:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/data-portal-backend:latest

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy data-portal-backend \
            --image=gcr.io/$PROJECT_ID/data-portal-backend:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --set-env-vars="DATABASE_URL=${{ steps.secrets.outputs.DATABASE_URL }},SECRET_KEY=${{ steps.secrets.outputs.SECRET_KEY }},GEMINI_API_KEY=${{ steps.secrets.outputs.GEMINI_API_KEY }},ALLOWED_ORIGINS=${{ steps.secrets.outputs.ALLOWED_ORIGINS }},GCP_PROJECT_ID=$PROJECT_ID,GCP_ZONE=me-central1-a,FIRECRAWL_VM_NAME=firecrawlimage-20260219-191632"

      # ─── FRONTEND ──────────────────────────────────────────────
      - name: Build Frontend Image
        run: |
          docker build \
            -t gcr.io/$PROJECT_ID/data-portal-frontend:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/data-portal-frontend:latest \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.secrets.outputs.NEXT_PUBLIC_API_URL }} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push gcr.io/$PROJECT_ID/data-portal-frontend:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/data-portal-frontend:latest

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy data-portal-frontend \
            --image=gcr.io/$PROJECT_ID/data-portal-frontend:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="NEXT_PUBLIC_API_URL=${{ steps.secrets.outputs.NEXT_PUBLIC_API_URL }}"
