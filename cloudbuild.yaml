steps:
  # ─── BACKEND ───────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/data-portal-backend:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/data-portal-backend:latest
      - ./backend

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/data-portal-backend

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - data-portal-backend
      - --image=gcr.io/$PROJECT_ID/data-portal-backend:$COMMIT_SHA
      - --region=me-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=DATABASE_URL=$$DATABASE_URL,SECRET_KEY=$$SECRET_KEY,GEMINI_API_KEY=$$GEMINI_API_KEY,ALLOWED_ORIGINS=$$ALLOWED_ORIGINS,GCP_PROJECT_ID=$PROJECT_ID,GCP_ZONE=me-central1-a,FIRECRAWL_VM_NAME=firecrawlimage-20260219-191632
    secretEnv:
      - DATABASE_URL
      - SECRET_KEY
      - GEMINI_API_KEY
      - ALLOWED_ORIGINS

  # ─── FRONTEND ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['deploy-backend']
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/data-portal-frontend:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/data-portal-frontend:latest
      - --build-arg
      - NEXT_PUBLIC_API_URL=$$NEXT_PUBLIC_API_URL
      - ./frontend
    secretEnv:
      - NEXT_PUBLIC_API_URL

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/data-portal-frontend

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - data-portal-frontend
      - --image=gcr.io/$PROJECT_ID/data-portal-frontend:$COMMIT_SHA
      - --region=me-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=NEXT_PUBLIC_API_URL=$$NEXT_PUBLIC_API_URL
    secretEnv:
      - NEXT_PUBLIC_API_URL

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/SECRET_KEY/versions/latest
      env: SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/ALLOWED_ORIGINS/versions/latest
      env: ALLOWED_ORIGINS
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_API_URL/versions/latest
      env: NEXT_PUBLIC_API_URL

options:
  logging: CLOUD_LOGGING_ONLY
