version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: data-portal-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataportal123}
      POSTGRES_DB: ${POSTGRES_DB:-dataportal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataportal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data-portal-backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL:-http://localhost:3002}
      - FIRECRAWL_VM_IP=${FIRECRAWL_VM_IP}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-uniapply-486919}
      - GCP_ZONE=${GCP_ZONE:-me-central1-b}
      - FIRECRAWL_VM_NAME=${FIRECRAWL_VM_NAME:-firecrawl}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-gemini-2.0-flash}
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    volumes:
      - ./backend:/app
      - ${APPDATA}/gcloud:/gcp:ro
    ports:
      - "8001:8000"
    networks:
      - app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8001
    container_name: data-portal-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
