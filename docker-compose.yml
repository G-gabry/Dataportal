version: '3.8'

# ── Database ──────────────────────────────────────────────────────────────────
# Uses Google Cloud SQL Auth Proxy — bypasses IP whitelists.
# The proxy securely tunnels port 5432 to your GCP Cloud SQL instance using
# your local gcloud credentials.

services:
  # ── Cloud SQL Auth Proxy ────────────────────────────────────────────────────
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
    container_name: cloud-sql-proxy
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "uniapply-486919:me-central1:data-portal-db"
    volumes:
      - ${APPDATA}/gcloud:/gcp:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data-portal-backend
    environment:
      # Connect to the local Auth Proxy container instead of public IP
      - DATABASE_URL=postgresql://dataportal:${POSTGRES_PASSWORD:-DataPortal2024}@cloud-sql-proxy:5432/data_portal
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL}
      - FIRECRAWL_VM_IP=${FIRECRAWL_VM_IP}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_ZONE=${GCP_ZONE}
      - FIRECRAWL_VM_NAME=${FIRECRAWL_VM_NAME}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-gemini-2.0-flash}
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp/application_default_credentials.json
    volumes:
      - ./backend:/app
      - ${APPDATA}/gcloud:/gcp:ro # GCP credentials for Cloud SQL auth
    ports:
      - "8001:8000"
    networks:
      - app_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8001
    container_name: data-portal-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
